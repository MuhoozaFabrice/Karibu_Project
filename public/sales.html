<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sales Agent Dashboard</title>
<link rel="stylesheet" href="./css/sales.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>

<div class="dashboard">

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <h2>Sales Agent</h2>

        <ul>
            <li onclick="switchSection('stock', this)" class="active"><i class="bi bi-boxes nav-icon" aria-hidden="true"></i><span>Branch Stock</span></li>
            <li onclick="switchSection('cash', this)"><i class="bi bi-cash-stack nav-icon" aria-hidden="true"></i><span>Record Sale</span></li>
            <li onclick="switchSection('credit', this)"><i class="bi bi-receipt-cutoff nav-icon" aria-hidden="true"></i><span>Credit Sale</span></li>
        </ul>

        <button class="logout"><i class="bi bi-box-arrow-right nav-icon" aria-hidden="true"></i><span>Logout</span></button>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="content">
        <div class="section-meta">
            <p><strong>Branch:</strong> <span id="currentBranch">-</span></p>
            <p><strong>Sales Agent:</strong> <span id="currentAgent">-</span></p>
        </div>
        <div id="salesNotice" class="dashboard-notice" role="status" aria-live="polite"></div>

        <!-- STOCK -->
        <div id="stock" class="section active">
            <h2>Branch Stock</h2>

            <table id="stockTable">
                <thead>
                    <tr>
                        <th>Produce</th>
                        <th>Type</th>
                        <th>Stock (kgs)</th>
                        <th>Price (UGX)</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>

        <!-- CASH SALES -->
        <div id="cash" class="section">
            <h2>Record Cash Sale</h2>

            <form id="cashSaleForm">
                <select id="produceName" required>
                    <option value="">Select Produce</option>
                    <option value="Beans">Beans</option>
                    <option value="Grain Maize">Grain Maize</option>
                    <option value="Cow peas">Cow peas</option>
                    <option value="G-nuts">G-nuts</option>
                    <option value="Soybeans">Soybeans</option>
                </select>
                <input type="number" id="tonnage" placeholder="Tonnage (kgs)" min="1" required>
                <input type="number" id="amountPaid" placeholder="Amount Paid (UGX)" min="10000" required>
                <input type="text" id="buyerName" placeholder="Buyer Name" minlength="2" pattern="[A-Za-z0-9 .-]{2,}" title="Use letters/numbers, at least 2 characters." required>
                <input type="text" id="agentName" placeholder="Sales Agent Name" readonly required>

                <button type="submit">Record Sale</button>
            </form>
        </div>

        <!-- CREDIT SALES -->
        <div id="credit" class="section">
            <h2>Record Credit Sale</h2>

            <form id="creditForm">
                <input type="text" id="cBuyer" placeholder="Buyer Name" minlength="2" pattern="[A-Za-z0-9 .-]{2,}" title="Use letters/numbers, at least 2 characters." required>
                <input type="text" id="nin" placeholder="NIN" minlength="13" maxlength="14" pattern="[A-Za-z0-9]{13,14}" title="Use a valid NIN format (13-14 letters/numbers)." required>
                <input type="text" id="location" placeholder="Location" minlength="2" pattern="[A-Za-z0-9 .-]{2,}" title="Use letters/numbers, at least 2 characters." required>
                <input type="text" id="contact" placeholder="Contact" pattern="\+?\d{10,15}" title="Use a valid phone number (10-15 digits)." required>
                <input type="number" id="amountDue" placeholder="Amount Due" min="10000" required>
                <select id="produceCredit" required>
                    <option value="">Select Produce</option>
                    <option value="Beans">Beans</option>
                    <option value="Grain Maize">Grain Maize</option>
                    <option value="Cow peas">Cow peas</option>
                    <option value="G-nuts">G-nuts</option>
                    <option value="Soybeans">Soybeans</option>
                </select>
                <input type="text" id="produceType" placeholder="Produce Type" pattern="[A-Za-z ]{2,}" title="Use letters only, at least 2 characters." required>
                <input type="number" id="creditTonnage" placeholder="Tonnage" min="1" required>
                <input type="date" id="dispatchDate" required>
                <input type="date" id="dueDate" required>

                <button type="submit">Save Credit Sale</button>
            </form>
        </div>

    </main>
</div>

<script src="./js/sales.js"></script>
</body>
</html>
