<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KGL System | Sign In</title>
    <link rel="stylesheet" href="./css/sign-in.css">
</head>

<body>

<div class="container">

    <!-- LEFT SIDE -->
    <div class="left-panel">
        <div class="logo-container">
            <img src="./assets/logo.svg" alt="Karibu Groceries Logo" class="logo">
        </div>
        <h1>KGL Management System</h1>
        <p>
            Welcome to Karibu Groceries LTD digital management platform.
            Manage procurement, sales, inventory and analytics efficiently.
        </p>
    </div>

    <!-- RIGHT SIDE -->
    <div class="right-panel">

        <form id="loginForm" class="login-form">

            <h2>Sign In</h2>

            <div class="input-group">
                <label>Email / Username</label>
                <input type="text" id="username" placeholder="Enter username" required>
                <small class="error" id="userError"></small>
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter password" required>
                <small class="error" id="passError"></small>
            </div>

            <div class="options">
                <label>
                    <input type="checkbox"> Remember me
                </label>
                <a href="#">Forgot password?</a>
            </div>

            <button type="submit" class="btn-login">
                Sign In
            </button>

            <p id="formMessage" class="form-message"></p>

        </form>

    </div>

</div>

<script src="./js/sign-in.js"></script>
</body>
</html>
