<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sales Agent Dashboard</title>
<link rel="stylesheet" href="../css/sales.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>

<div class="dashboard">

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <h2>Sales Agent</h2>

        <ul>
            <li onclick="openTab('stock', this)" class="active"><i class="bi bi-boxes nav-icon" aria-hidden="true"></i><span>Branch Stock</span></li>
            <li onclick="openTab('cash', this)"><i class="bi bi-cash-stack nav-icon" aria-hidden="true"></i><span>Record Sale</span></li>
            <li onclick="openTab('credit', this)"><i class="bi bi-receipt-cutoff nav-icon" aria-hidden="true"></i><span>Credit Sale</span></li>
        </ul>

        <button class="logout"><i class="bi bi-box-arrow-right nav-icon" aria-hidden="true"></i><span>Logout</span></button>
    </aside>

    <!-- MAIN CONTENT -->
    <main class="content">

        <!-- STOCK -->
        <section id="stock" class="tab active">
            <h2>Branch Stock</h2>

            <table id="stockTable">
                <thead>
                    <tr>
                        <th>Produce</th>
                        <th>Type</th>
                        <th>Stock (kgs)</th>
                        <th>Price (UGX)</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </section>

        <!-- CASH SALES -->
        <section id="cash" class="tab">
            <h2>Record Cash Sale</h2>

            <form id="cashSaleForm">
                <input type="text" id="produceName" placeholder="Produce Name" required>
                <input type="number" id="tonnage" placeholder="Tonnage (kgs)" required>
                <input type="number" id="amountPaid" placeholder="Amount Paid (UGX)" required>
                <input type="text" id="buyerName" placeholder="Buyer Name" required>
                <input type="text" id="agentName" placeholder="Sales Agent Name" required>

                <button type="submit">Record Sale</button>
            </form>
        </section>

        <!-- CREDIT SALES -->
        <section id="credit" class="tab">
            <h2>Record Credit Sale</h2>

            <form id="creditForm">
                <input type="text" id="cBuyer" placeholder="Buyer Name" required>
                <input type="text" id="nin" placeholder="NIN" required>
                <input type="text" id="location" placeholder="Location" required>
                <input type="text" id="contact" placeholder="Contact" required>
                <input type="number" id="amountDue" placeholder="Amount Due" required>
                <input type="text" id="produceCredit" placeholder="Produce Name" required>
                <input type="text" id="produceType" placeholder="Produce Type" required>
                <input type="number" id="creditTonnage" placeholder="Tonnage" required>
                
                <div class="date-section">
                    <h3 class="section-title">📅 Delivery Information</h3>
                    <label for="dispatchDate" class="date-label">Dispatch Date</label>
                    <p class="date-description">When goods are physically delivered to the buyer</p>
                    <input type="date" id="dispatchDate" class="dispatch-date" required>
                </div>
                
                <div class="date-section">
                    <h3 class="section-title">💰 Payment Terms</h3>
                    <label for="dueDate" class="date-label">Payment Due Date</label>
                    <p class="date-description">The deadline by which the buyer must pay the amount due</p>
                    <input type="date" id="dueDate" class="due-date" required>
                </div>

                <button type="submit">Save Credit Sale</button>
            </form>
        </section>

    </main>
</div>

<script src="../js/sales.js"></script>
</body>
</html>
