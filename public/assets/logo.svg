<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background White Circle with Shadow -->
  <defs>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F0FFFE;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main Background Circle -->
  <circle cx="100" cy="100" r="90" fill="url(#bgGradient)" filter="url(#shadow)"/>
  
  <!-- Accent Ring -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#10B981" stroke-width="3" opacity="0.4"/>
  
  <!-- Shopping Basket Icon -->
  <g transform="translate(50, 45)">
    <!-- Basket Body -->
    <path d="M 20 30 L 30 15 L 70 15 L 80 30 Z" fill="none" stroke="#10B981" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Basket Bottom -->
    <ellipse cx="50" cy="30" rx="30" ry="8" fill="none" stroke="#10B981" stroke-width="3.5"/>
    <!-- Basket Depth -->
    <path d="M 20 30 Q 30 50 50 55 Q 70 50 80 30" fill="none" stroke="#10B981" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Left Handle Top -->
    <path d="M 30 15 Q 20 5 30 -5" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round"/>
    <!-- Right Handle Top -->
    <path d="M 70 15 Q 80 5 70 -5" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round"/>
    <!-- Handle Arc -->
    <path d="M 30 -5 Q 50 -15 70 -5" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Leaf Accent (Growth/Fresh) -->
    <g transform="translate(75, 5)">
      <path d="M 0 0 Q 8 -5 12 -15 Q 8 -8 5 0" fill="#10B981"/>
      <path d="M 5 0 Q 10 -3 12 -15" fill="none" stroke="#10B981" stroke-width="2"/>
    </g>
  </g>
  
  <!-- Company Name -->
  <text x="100" y="165" font-family="Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#047857" letter-spacing="0.8">
    KARIBU GROCERIES
  </text>
</svg>